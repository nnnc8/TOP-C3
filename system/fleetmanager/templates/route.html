{% extends "layout.html" %}

{% block title %}路線檢視{% endblock %}

{% block main %}
  <section class="page-section is-viewer-page">
    <div class="section-row">
      <div>
        <p class="eyebrow">路線檢視</p>
        <h1>{{ route_id }}</h1>
        <p class="lede">目前選取的鏡頭會拿到更大畫面與更高畫質，其餘鏡頭則持續同步。</p>
      </div>
      <a class="ghost-button" href="/footage">回到路線庫</a>
    </div>
    <div class="viewer-shell" data-route-viewer data-route-id="{{ route_id }}">
      <article class="empty-state">
        <strong>正在載入路線資料...</strong>
        <p>正在準備鏡頭、分段與事件標記。</p>
      </article>
    </div>
  </section>
{% endblock %}

{% block scripts %}
  <script type="module" src="{{ url_for('static', filename='viewer.js') }}"></script>
{% endblock %}
